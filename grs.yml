name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Open Source contributions
      - name: DuckDB card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=duckdb&repo=duckdb
          path: profile/duckdb.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: DiceDB card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=DiceDB&repo=dice
          path: profile/dice.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rocket.Chat card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=RocketChat&repo=Rocket.Chat
          path: profile/rocketchat.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # My Key Projects
      - name: my-wal card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=my-wal
          path: profile/my-wal.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: diskbst card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=diskbst
          path: profile/diskbst.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: go-grpc-cache card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=go-grpc-cache
          path: profile/go-grpc-cache.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: my-memalloc-c card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=my-memalloc-c
          path: profile/my-memalloc-c.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: go-shorty card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=go-shorty
          path: profile/go-shorty.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: My-LSM-Tree-cpp card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=My-LSM-Tree-cpp
          path: profile/my-lsm-tree-cpp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: redis-clone-js card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=redis-clone-js
          path: profile/redis-clone-js.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: AlgorithmLibrary card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=AlgorithmLibrary
          path: profile/algorithm-library.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: AlgoDsLib card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=ashwaniYDV&repo=AlgoDsLib
          path: profile/algods-lib.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
